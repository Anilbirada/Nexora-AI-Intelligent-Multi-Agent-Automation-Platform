<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="tileGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
    <clipPath id="tileClip">
      <rect width="64" height="64" rx="14"/>
    </clipPath>
  </defs>
  
  <!-- Base Tile with Rounded Corners -->
  <g clip-path="url(#tileClip)">
    <rect width="64" height="64" fill="url(#tileGrad)"/>
    <!-- Glass Highlight -->
    <path d="M0 0 L64 0 L64 24 L0 40 Z" fill="#ffffff" fill-opacity="0.12"/>
    <!-- Tech Grid Lines -->
    <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="1">
      <path d="M21 0 V64 M43 0 V64 M0 21 H64 M0 43 H64"/>
    </g>
  </g>

  <!-- Centered Generative AI Spark -->
  <g transform="translate(10, 10) scale(1.833)">
    <!-- 4-point AI Diamond -->
    <path d="M12 2C12 7.52 7.52 12 2 12C7.52 12 12 16.48 12 22C12 16.48 16.48 12 22 12C16.48 12 12 7.52 12 2Z" fill="url(#sparkGrad)"/>
    <!-- Core Glow & Dot -->
    <circle cx="12" cy="12" r="3" fill="#4338ca"/>
    <circle cx="12" cy="12" r="1.5" fill="#ffffff"/>
    <!-- Node Satellites -->
    <circle cx="12" cy="4.2" r="1" fill="#ffffff"/>
    <circle cx="19.8" cy="12" r="1" fill="#ffffff"/>
    <circle cx="12" cy="19.8" r="1" fill="#ffffff"/>
    <circle cx="4.2" cy="12" r="1" fill="#ffffff"/>
  </g>
</svg>
