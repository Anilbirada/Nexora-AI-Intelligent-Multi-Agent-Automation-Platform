name: Nexora AI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Multi-Agent Regression Tests (${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20.x", "22.x"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Execute 8-Agent Multi-Agent Test Suite (122 Tests)
        env:
          ALLOW_EXTERNAL_OUTREACH: "false"
          ANIL_APPROVAL_EMAIL: "anil@nexgen.ai,anil@nexora.ai,aniladani843@gmail.com"
          DATABASE_URL: "postgres://postgres:password@localhost:5432/nexora_ai"
          DATABASE_SSL: "disable"
          BETTER_AUTH_SECRET: "ci-secret-for-testing-only-0000000000000000000000"
          BETTER_AUTH_URL: "http://localhost:3000"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
          NODE_ENV: "test"
        run: npm test

  quality:
    name: Code Quality & Platform Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Verify Package Metadata & Integrity
        run: |
          node -e "
            const pkg = require('./package.json');
            if (pkg.name !== 'nexora-ai') {
              console.error('Invalid package name:', pkg.name);
              process.exit(1);
            }
            console.log('✅ Verified package identity:', pkg.name, 'v' + pkg.version);
            console.log('✅ Author:', pkg.author);
            console.log('✅ Repository:', pkg.repository.url);
          "

      - name: Verify Environment Template Safety
        run: |
          node -e "
            const fs = require('fs');
            const env = fs.readFileSync('.env.example', 'utf8');
            if (env.includes('changeme-better-auth-secret') && env.includes('ALLOW_EXTERNAL_OUTREACH=false')) {
              console.log('✅ .env.example verified safe for production');
            }
          "
